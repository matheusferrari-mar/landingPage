<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body class="font-main">
    
    <header class="bg-black text-white flex flex-row justify-between px-8 py-9 items-center">
        
        <div class="flex flex-row gap-4 items-center">
            <div class="size-12">
                <img src="./img/icon-logo.svg" alt="Logo do site">
            </div>
            <h1 class="text-4xl">Portfólio</h1>
        </div>

        <div class="size-8">
            <img src="./img/icon-hamburger.svg" alt="Menu Hambúrguer">
        </div>
    </header>
        
    <section class="text-color-black bg-color-white px-6 py-16 flex flex-col gap-12 items-center">

        
        <div class="max-w-[400px] max-h-[400px]">
            <img src="./img/cell.png" alt="Imagem da Celli, mascote da Byron Solutions">
        </div>

        
        <div class="flex flex-col gap-8 items-center text-center">
            
            
            <div class="flex flex-col gap-4">
                <h2 class="text-5xl font-bold">
                    Conheça a <span class="text-color-secondary">Celli</span>
                </h2>
                
                <div class="flex flex-col gap-4">
                    <h3 class="text-2xl">
                        A mascote da <span class="text-color-secondary">Byron Solutions</span>
                    </h3>
                    <p class="text-base">
                        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
                    </p>
                </div>
            </div>  

            
            <button class="font-semibold text-color-white bg-color-main px-4 py-2 rounded-2xl hover:bg-emerald-600 transition duration-200 cursor-pointer">
                Saiba mais
            </button>

        </div>

        
        <div class="flex flex-col gap-6 items-center">
            <p class="text-2xl">Nosso contato</p>
            
            
            <div class="flex flex-row gap-6 justify-between items-center">
                <a href="#" class="size-12">
                    <img src="./img/icon-instagram.svg" alt="Logo Instagram">
                </a>
                <a href="#" class="size-12">
                    <img src="./img/icon-linkedin.svg" alt="Logo LinkedIn">
                </a>
                <a href="#" class="size-12">
                    <img src="./img/icon-whatsapp.svg" alt="Logo WhatsApp">
                </a>
            </div>
        </div>

    </section>
    <section class="bg-color-secondary text-color-white px-6 py-8 flex flex-col gap-8 items-center">
    
        <h2 class="text-2xl font-extralight">Últimos projetos</h2>

            <div class="grid grid-cols-1 gap-12">

                <div class="bg-color-white max-w-[380px] rounded-lg overflow-hidden shadow-lg flex flex-col gap-4 p-3">
                    
                    <div class="rounded-lg overflow-hidden">
                        <img src="./img/card-1.webp" alt="Projeto 1">
                    </div>

                    <div class="flex flex-col gap-1 text-color-black">
                        <h3 class="text-lg font-bold">Projeto 1</h3>
                        <p class="text-base text-color-gray">Aplicativo desktop</p>
                    </div>
                    
                </div>
            
            </div>
    </section>

</html>
